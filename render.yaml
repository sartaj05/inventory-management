services:
  - type: web
    name: inventory-backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: LOW_STOCK_THRESHOLD
        value: 5
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: WEB_CONCURRENCY
        value: 1

databases:
  - name: inventory-db
    plan: free
