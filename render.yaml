services:
  - type: web
    name: inventory-backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app
      - key: LOW_STOCK_THRESHOLD
        value: 5

databases:
  - name: inventory-db
    plan: free
